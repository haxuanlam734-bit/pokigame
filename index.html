<!DOCTYPE html>
<html>
<head>
  <title>City Parkour: Zombie Escape</title>
  <script src="https://unpkg.com"></script>
</head>
<body style="margin:0; overflow:hidden;">
<script>
  kaboom({
    background:,
  });

  setGravity(1600);

  const player = add([
    rect(40, 60),
    pos(100, 0),
    color(0, 120, 255),
    area(),
    body(),
  ]);

  const floor = add([
    rect(width(), 60),
    pos(0, height() - 60),
    outline(4),
    area(),
    body({ isStatic: true }),
    color(100, 100, 100),
  ]);

  let score = 0;
  const scoreLabel = add([
    text("Score: 0"),
    pos(24, 24),
  ]);

  onKeyPress("space", () => {
    if (player.isGrounded()) {
      player.jump(650);
    }
  });

  function spawnZombie() {
    add([
      rect(40, 50),
      pos(width(), height() - 110),
      color(255, 50, 50),
      area(),
      "zombie",
      move(LEFT, 350 + score * 10),
    ]);
    wait(rand(1.5, 3), spawnZombie);
  }

  spawnZombie();

  onUpdate(() => {
    score++;
    scoreLabel.text = "Score: " + score;
  });

  player.onCollide("zombie", () => {
    shake();
    add([
      text("GAME OVER\nPress Space to Restart"),
      pos(width() / 2, height() / 2),
      anchor("center"),
    ]);
    destroy(player);
    onKeyPress("space", () => {
      location.reload();
    });
  });
</script>
</body>
</html>
