<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pháo Đài Chống Zombie - Fortress Defense</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0a0a0f;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
        }

        /* ===== UI OVERLAY ===== */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ===== PANELS ===== */
        .panel {
            position: absolute;
            background: rgba(10, 12, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 180, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            pointer-events: auto;
            color: #e0e8f0;
        }

        /* ===== TOP-LEFT PANEL (Phase & Wave) ===== */
        #top-panel {
            top: 20px;
            left: 20px;
            min-width: 200px;
            border-left: 3px solid #00ffb4;
        }
        #top-panel .phase-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            background: rgba(0, 255, 180, 0.15);
            color: #00ffb4;
            border: 1px solid rgba(0, 255, 180, 0.3);
        }
        #top-panel .phase-badge.night {
            background: rgba(255, 75, 75, 0.15);
            color: #ff4d4d;
            border-color: rgba(255, 75, 75, 0.3);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 16px;
            font-weight: 600;
        }
        .stat-row .label {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .stat-row .value {
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .stat-row .value.time {
            color: #ffd700;
        }
        #time-display {
            min-width: 50px;
            text-align: right;
        }

        /* ===== TOP-RIGHT PANEL (Resources) ===== */
        #right-panel {
            top: 20px;
            right: 20px;
            min-width: 170px;
            border-left: 3px solid #ffd700;
        }
        #right-panel .resource {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        #right-panel .resource .icon {
            font-size: 22px;
            line-height: 1;
        }
        #right-panel .resource .amount {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 22px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        #right-panel .resource .amount.money {
            color: #ffd700;
        }
        #right-panel .resource .amount.hp {
            color: #ff4d4d;
        }

        /* HP Bar */
        #hp-bar-container {
            margin-top: 8px;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        #hp-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ffd700, #00ffb4);
            border-radius: 4px;
            transition: width 0.3s ease;
        }


        /* ===== PLAYER HEALTH / STAMINA HUD ===== */
        .resource-health { align-items: flex-start !important; margin-top: 10px !important; }
        .resource-main { flex: 1; min-width: 0; }
        .resource-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .resource-head .amount { font-size: 16px !important; }
        .amount.stamina { color:#5ee7ff !important; }
        .loss-text { font-size: 10px; font-family:'Orbitron',monospace; color:#ff8585; white-space:nowrap; opacity:.85; }
        .sprint-hint { font-size: 9px; font-family:'Orbitron',monospace; color:rgba(94,231,255,.65); letter-spacing:.6px; white-space:nowrap; }
        .health-track {
            position:relative; width:100%; height:9px; margin-top:5px; border-radius:5px; overflow:hidden;
            background:rgba(255,255,255,.07);
            box-shadow: inset 0 1px 2px rgba(0,0,0,.55);
        }
        .health-track::after {
            content:""; position:absolute; inset:0; pointer-events:none; opacity:.28;
            background:repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 10%);
        }
        #hp-lost-bar { position:absolute; right:0; top:0; height:100%; width:0%; background:linear-gradient(90deg,#6d2a33,#2b1117); transition:width .18s ease; }
        #hp-bar { position:absolute; left:0; top:0; height:100%; width:100%; background:linear-gradient(90deg,#ff3f52,#ff8b5c); border-radius:5px; transition:width .18s ease; }
        .stamina-track { background:rgba(94,231,255,.07); }
        #stamina-bar { position:absolute; left:0; top:0; height:100%; width:100%; background:linear-gradient(90deg,#28b8ff,#74f6ff); border-radius:5px; transition:width .12s linear; }

        /* ===== MEDICAL QUICK SLOTS ===== */
        .medical-kit-panel {
            position:absolute; right:24px; bottom:122px; display:flex; gap:8px; pointer-events:auto;
            padding:8px; border:1px solid rgba(255,255,255,.09); border-radius:15px;
            background:rgba(8,11,18,.72); backdrop-filter:blur(14px); box-shadow:0 12px 32px rgba(0,0,0,.4);
        }
        .med-item {
            min-width:150px; display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:11px;
            background:rgba(255,255,255,.045); color:#fff; border:1px solid rgba(255,255,255,.08); cursor:pointer; pointer-events:auto;
            font-family:'Rajdhani',sans-serif; transition:.18s ease;
        }
        .med-item:hover { transform:translateY(-2px); background:rgba(255,255,255,.085); border-color:rgba(82,245,184,.35); }
        .med-item.disabled { opacity:.35; filter:grayscale(.65); cursor:not-allowed; transform:none; }
        .med-icon { font-size:22px; }
        .med-meta { display:flex; flex-direction:column; align-items:flex-start; line-height:1; flex:1; }
        .med-meta b { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:.8px; }
        .med-meta small { margin-top:4px; color:rgba(255,255,255,.46); font-size:9px; letter-spacing:.5px; }
        .med-count { min-width:26px; height:26px; display:grid; place-items:center; border-radius:8px; background:rgba(0,255,180,.1); border:1px solid rgba(0,255,180,.2); color:#69ffcc; font-family:'Orbitron',monospace; font-size:11px; }
        @media (max-width: 800px) {
            .medical-kit-panel { right:12px; bottom:150px; flex-direction:column; }
            .med-item { min-width:138px; }
            #right-panel { right:12px; top:12px; min-width:190px; }
        }

        /* ===== BOTTOM PANEL (Build Buttons) ===== */
        #bottom-panel {
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 14px 24px;
            background: rgba(10, 12, 20, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 180, 0.15);
            border-radius: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
        }

        .btn-build {
            pointer-events: auto;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-build .icon {
            font-size: 18px;
        }
        .btn-build .cost {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            opacity: 0.8;
        }
        .btn-build.available {
            background: rgba(0, 255, 180, 0.12);
            color: #00ffb4;
            border-color: rgba(0, 255, 180, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 180, 0.05);
        }
        .btn-build.available:hover {
            background: rgba(0, 255, 180, 0.2);
            border-color: #00ffb4;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 255, 180, 0.15);
        }
        .btn-build.available:active {
            transform: scale(0.96);
        }
        .btn-build.active {
            background: #00ffb4;
            color: #0a0a0f;
            border-color: #00ffb4;
            box-shadow: 0 0 40px rgba(0, 255, 180, 0.3);
        }
        .btn-build.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .btn-build.ads {
            background: rgba(255, 215, 0, 0.12);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.25);
        }
        .btn-build.ads:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            transform: translateY(-2px);
        }

        /* ===== JOYSTICK ===== */
        #joystick-container {
            position: absolute;
            bottom: 100px;
            left: 24px;
            width: 110px;
            height: 110px;
            background: rgba(0, 255, 180, 0.06);
            border: 1px solid rgba(0, 255, 180, 0.15);
            border-radius: 50%;
            pointer-events: auto;
            display: none;
            z-index: 50;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(0, 255, 180, 0.05), inset 0 0 40px rgba(0, 255, 180, 0.02);
        }
        #joystick-thumb {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 30% 30%, #00ffb4, #008b7a);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            box-shadow: 0 0 30px rgba(0, 255, 180, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #joystick-thumb:active {
            cursor: grabbing;
        }

        /* ===== GAME OVER SCREEN ===== */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: auto;
        }
        .go-container {
            background: rgba(10, 12, 20, 0.9);
            border: 1px solid rgba(255, 75, 75, 0.3);
            border-radius: 32px;
            padding: 48px 56px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
        }
        .go-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 40px;
            color: #ff4d4d;
            text-shadow: 0 0 60px rgba(255, 75, 75, 0.2);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .go-sub {
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            margin-bottom: 28px;
        }
        .go-stats {
            display: flex;
            justify-content: space-around;
            gap: 16px;
            margin-bottom: 32px;
        }
        .go-stat {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 16px 12px;
            flex: 1;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .go-stat .num {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 28px;
            color: #ffffff;
        }
        .go-stat .label {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }
        .go-stat .num.gold {
            color: #ffd700;
        }
        .go-stat .num.green {
            color: #00ffb4;
        }
        #restart-button {
            pointer-events: auto;
            padding: 14px 40px;
            border: none;
            border-radius: 60px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 30px rgba(255, 75, 75, 0.2);
            width: 100%;
        }
        #restart-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 75, 75, 0.3);
        }

        /* ===== LOADING SCREEN ===== */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            color: #00ffb4;
            font-family: 'Rajdhani', sans-serif;
        }
        .loader-ring {
            width: 64px;
            height: 64px;
            border: 3px solid rgba(0, 255, 180, 0.08);
            border-top: 3px solid #00ffb4;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(0, 255, 180, 0.05);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0.7;
        }


        /* ===== MILITARY INTERACTION ===== */
        #military-interaction {
            position: absolute;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%) translateY(14px);
            min-width: 300px;
            max-width: 420px;
            padding: 14px 16px;
            border: 1px solid rgba(115, 231, 255, 0.28);
            border-radius: 16px;
            background: rgba(12, 18, 22, 0.92);
            box-shadow: 0 18px 50px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
            pointer-events: none;
            opacity: 0;
            transition: .18s ease;
            z-index: 30;
        }
        #military-interaction.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        #military-interaction-title { font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 800; color: #73e7ff; letter-spacing: 1px; }
        #military-interaction-desc { margin-top: 5px; color: rgba(255,255,255,0.72); font-size: 13px; line-height: 1.35; }
        #military-interaction-action {
            margin-top: 10px; border: 0; border-radius: 10px; padding: 9px 12px; width: 100%;
            background: linear-gradient(135deg, #1c9bd1, #0f6d95); color: #fff; font-weight: 800;
            cursor: pointer; pointer-events: auto; font-family: 'Rajdhani', sans-serif;
        }
        #military-toast {
            position: absolute; left: 50%; top: 84px; transform: translateX(-50%) translateY(-10px);
            min-width: 310px; max-width: 480px; padding: 13px 16px; border-radius: 14px;
            background: rgba(10, 15, 18, 0.95); border: 1px solid rgba(0,255,180,0.22);
            box-shadow: 0 14px 45px rgba(0,0,0,.35); z-index: 50; opacity: 0; transition: .2s ease; pointer-events: none;
        }
        #military-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        #military-toast .toast-title { font-family: 'Orbitron', monospace; font-size: 14px; color: #00ffb4; font-weight: 800; }
        #military-toast .toast-message { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,0.78); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .panel { padding: 12px 14px; border-radius: 12px; }
            #top-panel { min-width: 140px; }
            #right-panel { min-width: 120px; }
            .stat-row { font-size: 13px; }
            .stat-row .value { font-size: 15px; }
            #right-panel .resource .amount { font-size: 18px; }
            #bottom-panel {
                padding: 10px 16px;
                gap: 8px;
                bottom: 16px;
                border-radius: 16px;
            }
            .btn-build {
                padding: 8px 14px;
                font-size: 13px;
                border-radius: 10px;
            }
            .btn-build .icon { font-size: 15px; }
            .btn-build .cost { font-size: 11px; }
            .go-container { padding: 32px 24px; }
            .go-title { font-size: 30px; }
            .go-stats { flex-direction: column; }
            #joystick-container { width: 90px; height: 90px; bottom: 80px; left: 16px; }
            #joystick-thumb { width: 36px; height: 36px; }
        }
        @media (max-width: 480px) {
            #top-panel { top: 12px; left: 12px; padding: 10px; min-width: 100px; }
            #right-panel { top: 12px; right: 12px; padding: 10px; min-width: 80px; }
            .stat-row { font-size: 11px; }
            .stat-row .value { font-size: 13px; }
            #right-panel .resource .amount { font-size: 15px; }
            .btn-build { font-size: 11px; padding: 6px 10px; gap: 4px; }
            #bottom-panel { padding: 8px 12px; gap: 6px; }
            .go-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- LOADING -->
        <div id="loading-screen">
            <div class="loader-ring"></div>
            <div class="loader-text">ĐANG TRIỂN KHAI CĂN CỨ...</div>
        </div>

        <!-- GAME OVER -->
        <div id="game-over-screen">
            <div class="go-container">
                <div class="go-title">CĂN CỨ THẤT THỦ</div>
                <div class="go-sub">Fortress has fallen</div>
                <div class="go-stats">
                    <div class="go-stat">
                        <div class="num" id="final-wave">0</div>
                        <div class="label">SÓNG ZOMBIE</div>
                    </div>
                    <div class="go-stat">
                        <div class="num gold" id="final-money">0</div>
                        <div class="label">TIỀN TÍCH LŨY</div>
                    </div>
                    <div class="go-stat">
                        <div class="num green" id="final-score">0</div>
                        <div class="label">ĐIỂM SỐ</div>
                    </div>
                </div>
                <button id="restart-button">⚡ CHƠI LẠI</button>
            </div>
        </div>

        <!-- UI OVERLAY -->
        <div id="ui-overlay">
            <!-- TOP LEFT -->
            <div id="top-panel" class="panel">
                <div class="phase-badge" id="phase-badge">☀️ NGÀY</div>
                <div class="stat-row">
                    <span class="label">SÓNG</span>
                    <span class="value" id="wave-display">1</span>
                </div>
                <div class="stat-row">
                    <span class="label">THỜI GIAN</span>
                    <span class="value time" id="time-display">60s</span>
                </div>
            </div>

            <!-- TOP RIGHT -->
            <div id="right-panel" class="panel">
                <div class="resource">
                    <span class="icon">💰</span>
                    <span class="amount money" id="money-display">500</span>
                </div>
                <div class="resource resource-health">
                    <span class="icon">❤️</span>
                    <div class="resource-main">
                        <div class="resource-head">
                            <span class="amount hp" id="hp-display">100/100</span>
                            <span class="loss-text" id="hp-loss-display"></span>
                        </div>
                        <div class="health-track" id="health-track">
                            <div class="health-lost" id="hp-lost-bar"></div>
                            <div class="health-current" id="hp-bar"></div>
                        </div>
                    </div>
                </div>
                <div class="resource resource-health">
                    <span class="icon">⚡</span>
                    <div class="resource-main">
                        <div class="resource-head">
                            <span class="amount stamina" id="stamina-display">100</span>
                            <span class="sprint-hint">SHIFT · SPRINT</span>
                        </div>
                        <div class="health-track stamina-track">
                            <div class="stamina-current" id="stamina-bar"></div>
                        </div>
                    </div>
                </div>
                <div class="resource">
                    <span class="icon">🔫</span>
                    <span class="amount" id="ammo-display">120/120</span>
                </div>
                <div class="resource">
                    <span class="icon">🎯</span>
                    <span class="amount" id="weapon-display">T1 • 10 DMG</span>
                </div>
            </div>

            <div id="medical-kit-panel" class="medical-kit-panel">
                <button class="med-item" id="btn-bandage" title="Dùng Bandage - +10 HP capacity">
                    <span class="med-icon">🩹</span>
                    <span class="med-meta"><b>BANDAGE</b><small>+10 HP CAP</small></span>
                    <span class="med-count" id="bandage-count">3</span>
                </button>
                <button class="med-item" id="btn-medkit" title="Dùng hộp cấp cứu - khôi phục 100% HP">
                    <span class="med-icon">⛑️</span>
                    <span class="med-meta"><b>MEDKIT</b><small>FULL HEAL</small></span>
                    <span class="med-count" id="medkit-count">1</span>
                </button>
            </div>

            <!-- BOTTOM BUTTONS -->
            <div id="bottom-panel">
