<!DOCTYPE html>
<html>
<head>
  <title>City Parkour: Zombie Escape</title>
  <script src="https://unpkg.com"></script>
</head>
<body style="margin:0; overflow:hidden; background-color:black;">
<script>
  // 1. Khởi tạo môi trường game Kaboom
  kaboom();

  // 2. Cài đặt màu nền đen độc lập
  setBackground(0, 0, 0);

  // 3. Thiết lập trọng lực vật lý
  setGravity(1600);

  // 4. Tạo nhân vật người chơi màu xanh lam
  const player = add([
    rect(40, 60),
    pos(100, 100),
    color(0, 120, 255),
    area(),
    body(),
  ]);

  // 5. Tạo mặt đất cố định màu xám
  const floor = add([
    rect(width(), 60),
    pos(0, height() - 60),
    outline(4),
    area(),
    body({ isStatic: true }),
    color(100, 100, 100),
  ]);

  // 6. Hệ thống hiển thị điểm số
  let score = 0;
  const scoreLabel = add([
    text("Score: 0"),
    pos(24, 24),
  ]);

  // 7. Nhấn Spacebar để nhảy né vật cản
  onKeyPress("space", () => {
    if (player.isGrounded()) {
      player.jump(700);
    }
  });

  // 8. Hàm sinh Zombie (Khối hộp đỏ) chạy từ bên phải qua
  function spawnZombie() {
    add([
      rect(40, 50),
      pos(width(), height() - 110),
      color(255, 50, 50),
      area(),
      "zombie",
      move(LEFT, 350),
    ]);
    wait(rand(1.5, 3), spawnZombie);
  }

  // Bắt đầu sinh zombie liên tục
  spawnZombie();

  // 9. Tăng điểm số theo thời gian sống sót
  onUpdate(() => {
    score++;
    scoreLabel.text = "Score: " + score;
  });

  // 10. Xử lý va chạm khi thua cuộc
  player.onCollide("zombie", () => {
    shake();
    add([
      text("GAME OVER\nPress Space to Restart"),
      pos(width() / 2, height() / 2),
      anchor("center"),
    ]);
    destroy(player);
    onKeyPress("space", () => {
      location.reload();
    });
  });
</script>
</body>
</html>
